  <h2>WhatsApp Chat Cleaner & CSV Exporter</h2>

  <input type="file" id="fileInput" accept=".txt" />

  <div class="option-group">
    <p><strong>Extraction Starting Point:</strong></p>
    <input type="radio" id="optAuto" name="extractOpt" value="auto" checked>
    <label for="optAuto">Auto-detect from Last Line (GAS)</label>
    <br>
    <input type="radio" id="optDate" name="extractOpt" value="manual">
    <label for="optDate">Start from specific Date:</label>
    <input type="date" id="manualDate" />
  </div>

  <button id="processBtn">Process & Download CSV</button>
  <p id="status"></p>
  <div id='tdata'></div>

    // Capturing version so we can pull out the individual date/time components.
    const TIMESTAMP_REGEX = /^\[(\d{2})\/(\d{2})\/(\d{4}), (\d{2}):(\d{2}):(\d{2})\]/;
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzGpguV0hLcJzvU2PLC70zaSJqiw-MPxtD_QKlKsuDV-s7UYb0EPMIYf_gTeoRCeA2cXg/exec";

    // exact-string search already ran, which is why the search so often
    // failed to find the reference line. Stripping them before comparison
    // fixes that class of failure.
    function stripInvisible(str) {
      return (str || "").replace(/\u200e|\u202f|\u200b/g, "");
    }

      const match = cleaned.match(TIMESTAMP_REGEX);
      if (!match) return null;
      const [, day, month, year, hour, min, sec] = match;
      const d = new Date(
        Number(year), Number(month) - 1, Number(day),

      const url = URL.createObjectURL(blob);

      a.download = "whatsapp_cleaned.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
